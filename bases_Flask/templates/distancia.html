{% extends "layout.html" %}
    {% block container %}
    
    <h1>Distancia entre dos puntos</h1>

    <form action="/distancia" method="post">
        <div class="row">
            <div class="col-md-6">
                <h3>Punto 1</h3>
                <div class="mb-3">
                    <label for="x1" class="form-label">Coordenada X1:</label>
                    <input type="number"  class="form-control" id="x1" name="x1">
                </div>
                <div class="mb-3">
                    <label for="y1" class="form-label">Coordenada Y1:</label>
                    <input type="number" class="form-control" id="y1" name="y1">
                </div>
            </div>

            <div class="col-md-6">
                <h3>Punto 2</h3>
                <div class="mb-3">
                    <label for="x2" class="form-label">Coordenada X2:</label>
                    <input type="number"  class="form-control" id="x2" name="x2">
                </div>
                <div class="mb-3">
                    <label for="y2" class="form-label">Coordenada Y2:</label>
                    <input type="number" class="form-control" id="y2" name="y2">
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Calcular Distancia</button>
    </form>

    {% if request.method == 'POST' %}
        <h1 class="mt-4">
            La distancia entre los puntos ({{x1}}, {{y1}}) y ({{x2}}, {{y2}}) es = {{ "%.2f"|format(res)}}
        </h1>
    {% endif %}
    {% endblock %}
